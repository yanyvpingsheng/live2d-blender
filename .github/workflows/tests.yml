name: SDK-free Python tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-test.txt
      - name: Audit public source tree
        run: PYTHONDONTWRITEBYTECODE=1 python scripts/audit_public.py
      - name: Run SDK-free tests
        run: PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Build installer
        run: PYTHONDONTWRITEBYTECODE=1 python scripts/package.py
